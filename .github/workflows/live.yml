name: live snapshot

# Refreshes live.json from Steam / PSN / GitHub on a schedule.
# Runs ONLY on a timer + manual trigger (never on push), so it can't loop on
# its own commits — no [skip ci] marker needed, and leaving it off keeps the
# Pages rebuild from being suppressed.
on:
  schedule:
    - cron: "*/20 * * * *"   # every ~20 min (GitHub may delay under load)
  workflow_dispatch: {}

permissions:
  contents: write             # needed to commit the refreshed live.json

concurrency:
  group: live-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps (PSN client)
        working-directory: scripts
        run: npm ci || npm install

      - name: Build live.json
        run: node scripts/build-live.mjs
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          GH_USER: ${{ vars.GH_USER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "live-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh live.json"
            git push
          fi
